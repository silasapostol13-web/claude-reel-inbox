<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="t d">
  <title id="t">Reel Inbox</title>
  <desc id="d">Share a Reel from Instagram to "Send to Claude", add a note, your Mac transcribes it and pulls key frames, then Claude Code reads it all with one request.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14121a"/>
      <stop offset="1" stop-color="#1d1a24"/>
    </linearGradient>
    <linearGradient id="reel" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#3b2f5c"/>
      <stop offset="0.55" stop-color="#7a3b5e"/>
      <stop offset="1" stop-color="#c2643f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8875b"/>
      <stop offset="1" stop-color="#d9674a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b8496"/>
    </marker>
  </defs>

  <style>
    .sans { font-family: -apple-system, "SF Pro Text", "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .step { fill: #e8875b; font-size: 13px; font-weight: 700; letter-spacing: 1.5px; }
    .cap  { fill: #f3eff7; font-size: 19px; font-weight: 650; }
    .sub  { fill: #a29bb0; font-size: 14px; }
  </style>

  <rect width="1280" height="640" rx="28" fill="url(#bg)"/>

  <!-- ============ 1. Share from Instagram ============ -->
  <g transform="translate(56,70)">
    <text class="sans step" x="0" y="0">1 · SHARE</text>
    <text class="sans cap" x="0" y="28">From Instagram or TikTok</text>
    <g transform="translate(14,52)" filter="url(#shadow)">
      <rect width="232" height="452" rx="34" fill="#0b0a0e" stroke="#3a3542" stroke-width="2"/>
      <rect x="10" y="10" width="212" height="432" rx="26" fill="url(#reel)"/>
      <rect x="86" y="18" width="60" height="16" rx="8" fill="#0b0a0e"/>
      <!-- reel overlay -->
      <circle cx="116" cy="130" r="26" fill="#ffffff" fill-opacity="0.18"/>
      <path d="M108 116 L130 130 L108 144 z" fill="#fff" fill-opacity="0.85"/>
      <!-- share sheet -->
      <rect x="10" y="212" width="212" height="230" rx="22" fill="#232029"/>
      <rect x="96" y="222" width="40" height="5" rx="2.5" fill="#4a4553"/>
      <g class="sans" font-size="13">
        <rect x="24" y="244" width="184" height="40" rx="10" fill="#2e2a35"/>
        <text x="40" y="269" fill="#d9d4e0">Copy link</text>
        <rect x="24" y="292" width="184" height="46" rx="10" fill="url(#accent)"/>
        <circle cx="46" cy="315" r="11" fill="#fff" fill-opacity="0.95"/>
        <path d="M46 307 l2.2 5.8 l5.8 2.2 l-5.8 2.2 l-2.2 5.8 l-2.2 -5.8 l-5.8 -2.2 l5.8 -2.2 z" fill="#d9674a"/>
        <text x="66" y="320" fill="#fff" font-weight="700" font-size="14">Send to Claude</text>
        <rect x="24" y="346" width="184" height="40" rx="10" fill="#2e2a35"/>
        <text x="40" y="371" fill="#d9d4e0">Add to Favorites</text>
        <rect x="24" y="394" width="184" height="36" rx="10" fill="#2e2a35"/>
        <text x="40" y="417" fill="#8b8496">Edit Actions…</text>
      </g>
    </g>
  </g>

  <!-- arrow 1 -->
  <line x1="320" y1="330" x2="352" y2="330" stroke="#8b8496" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- ============ 2. Add a note ============ -->
  <g transform="translate(366,70)">
    <text class="sans step" x="0" y="0">2 · NOTE</text>
    <text class="sans cap" x="0" y="28">Say why you sent it</text>
    <g transform="translate(14,52)" filter="url(#shadow)">
      <rect width="232" height="452" rx="34" fill="#0b0a0e" stroke="#3a3542" stroke-width="2"/>
      <rect x="10" y="10" width="212" height="432" rx="26" fill="#1b1920"/>
      <rect x="86" y="18" width="60" height="16" rx="8" fill="#0b0a0e"/>
      <!-- toast -->
      <rect x="22" y="48" width="188" height="48" rx="14" fill="#2e2a35"/>
      <circle cx="44" cy="72" r="10" fill="url(#accent)"/>
      <text class="sans" x="62" y="68" fill="#f3eff7" font-size="12" font-weight="700">Sent to Claude</text>
      <text class="sans" x="62" y="85" fill="#a29bb0" font-size="11">Your Mac will pick it up</text>
      <!-- prompt card -->
      <rect x="22" y="132" width="188" height="214" rx="16" fill="#2a2631"/>
      <text class="sans" x="38" y="162" fill="#f3eff7" font-size="13.5" font-weight="700">Why are you sending</text>
      <text class="sans" x="38" y="180" fill="#f3eff7" font-size="13.5" font-weight="700">this, and for which</text>
      <text class="sans" x="38" y="198" fill="#f3eff7" font-size="13.5" font-weight="700">project?</text>
      <rect x="34" y="214" width="164" height="78" rx="10" fill="#18161d" stroke="#e8875b" stroke-width="1.5"/>
      <text class="sans" x="46" y="238" fill="#e9e4ef" font-size="12.5">Sound effects idea</text>
      <text class="sans" x="46" y="256" fill="#e9e4ef" font-size="12.5">for the app demo</text>
      <text class="sans" x="46" y="274" fill="#e9e4ef" font-size="12.5">video</text>
      <rect x="82" y="264" width="2" height="13" fill="#e8875b"/>
      <rect x="34" y="304" width="164" height="30" rx="9" fill="url(#accent)"/>
      <text class="sans" x="116" y="324" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">Done</text>
      <!-- mic -->
      <circle cx="116" cy="396" r="22" fill="#2e2a35"/>
      <rect x="110" y="383" width="12" height="20" rx="6" fill="#d9d4e0"/>
      <path d="M104 396 a12 12 0 0 0 24 0" fill="none" stroke="#d9d4e0" stroke-width="2"/>
      <line x1="116" y1="408" x2="116" y2="413" stroke="#d9d4e0" stroke-width="2"/>
    </g>
  </g>

  <!-- arrow 2 -->
  <line x1="630" y1="330" x2="662" y2="330" stroke="#8b8496" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- ============ 3. Your Mac ============ -->
  <g transform="translate(676,70)">
    <text class="sans step" x="0" y="0">3 · YOUR MAC</text>
    <text class="sans cap" x="0" y="28">Processed locally</text>
    <g class="sans" transform="translate(0,62)">
      <g>
        <rect width="196" height="54" rx="14" fill="#25222b" stroke="#3a3542"/>
        <text x="16" y="24" fill="#f3eff7" font-size="14" font-weight="650">iCloud Drive queue</text>
        <text x="16" y="42" fill="#a29bb0" font-size="12">waits while the Mac is off</text>
      </g>
      <line x1="98" y1="56" x2="98" y2="74" stroke="#8b8496" stroke-width="2" marker-end="url(#arrow)"/>
      <g transform="translate(0,78)">
        <rect width="196" height="54" rx="14" fill="#25222b" stroke="#3a3542"/>
        <text x="16" y="24" fill="#f3eff7" font-size="14" font-weight="650">Download</text>
        <text x="16" y="42" fill="#a29bb0" font-size="12" class="mono">yt-dlp</text>
      </g>
      <line x1="98" y1="134" x2="98" y2="152" stroke="#8b8496" stroke-width="2" marker-end="url(#arrow)"/>
      <g transform="translate(0,156)">
        <rect width="196" height="54" rx="14" fill="#25222b" stroke="#3a3542"/>
        <text x="16" y="24" fill="#f3eff7" font-size="14" font-weight="650">Transcript</text>
        <text x="16" y="42" fill="#a29bb0" font-size="12" class="mono">whisper.cpp</text>
      </g>
      <line x1="98" y1="212" x2="98" y2="230" stroke="#8b8496" stroke-width="2" marker-end="url(#arrow)"/>
      <g transform="translate(0,234)">
        <rect width="196" height="54" rx="14" fill="#25222b" stroke="#3a3542"/>
        <text x="16" y="24" fill="#f3eff7" font-size="14" font-weight="650">Key frames + OCR</text>
        <text x="16" y="42" fill="#a29bb0" font-size="12" class="mono">ffmpeg · Apple Vision</text>
      </g>
      <line x1="98" y1="290" x2="98" y2="308" stroke="#8b8496" stroke-width="2" marker-end="url(#arrow)"/>
      <g transform="translate(0,312)">
        <rect width="196" height="54" rx="14" fill="#2a1f1c" stroke="#e8875b"/>
        <text x="16" y="24" fill="#f3eff7" font-size="14" font-weight="650">~/ReelInbox/</text>
        <text x="16" y="42" fill="#e8b49a" font-size="12">reel.md · frames/*.jpg</text>
      </g>
      <text x="0" y="404" fill="#a29bb0" font-size="12.5">No server. No account.</text>
      <text x="0" y="422" fill="#a29bb0" font-size="12.5">Nothing leaves your Mac.</text>
    </g>
  </g>

  <!-- arrow 3 -->
  <line x1="888" y1="330" x2="920" y2="330" stroke="#8b8496" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- ============ 4. Claude Code ============ -->
  <g transform="translate(934,70)">
    <text class="sans step" x="0" y="0">4 · ASK CLAUDE</text>
    <text class="sans cap" x="0" y="28">In any Claude Code session</text>
    <g transform="translate(0,52)" filter="url(#shadow)">
      <rect width="292" height="452" rx="16" fill="#0f0e12" stroke="#3a3542" stroke-width="2"/>
      <circle cx="20" cy="20" r="5.5" fill="#ff5f57"/>
      <circle cx="38" cy="20" r="5.5" fill="#febc2e"/>
      <circle cx="56" cy="20" r="5.5" fill="#28c840"/>
      <g class="mono" font-size="11.5">
        <text x="16" y="60" fill="#e8875b">&gt;</text>
        <text x="30" y="60" fill="#f3eff7">get the reel I just sent</text>
        <text x="16" y="88" fill="#a29bb0">● reel-inbox · get_reel</text>
        <text x="16" y="116" fill="#e8b49a" font-weight="700">Note</text>
        <text x="16" y="133" fill="#d9d4e0">Sound effects idea for the</text>
        <text x="16" y="148" fill="#d9d4e0">app demo video</text>
        <text x="16" y="174" fill="#e8b49a" font-weight="700">Transcript</text>
        <text x="16" y="191" fill="#d9d4e0">[0:00] Your videos sound fake</text>
        <text x="16" y="206" fill="#d9d4e0">       until you fix the audio</text>
        <text x="16" y="221" fill="#d9d4e0">[0:06] Step one: a free SFX...</text>
        <text x="16" y="247" fill="#e8b49a" font-weight="700">Frames</text>
      </g>
      <!-- frame thumbnails -->
      <g transform="translate(16,258)">
        <rect width="58" height="96" rx="6" fill="url(#reel)"/>
        <rect x="66" width="58" height="96" rx="6" fill="#26313f"/>
        <rect x="72" y="14" width="46" height="4" rx="2" fill="#7fb0d8"/>
        <rect x="72" y="24" width="36" height="4" rx="2" fill="#9ccf9a"/>
        <rect x="72" y="34" width="42" height="4" rx="2" fill="#d9d4e0"/>
        <rect x="72" y="44" width="28" height="4" rx="2" fill="#e8875b"/>
        <rect x="132" width="58" height="96" rx="6" fill="#3a2a33"/>
        <rect x="140" y="58" width="42" height="26" rx="4" fill="#e8875b" fill-opacity="0.7"/>
        <rect x="198" width="58" height="96" rx="6" fill="#22352c"/>
        <circle cx="227" cy="40" r="15" fill="#9ccf9a" fill-opacity="0.6"/>
      </g>
      <g class="mono" font-size="11.5">
        <text x="16" y="384" fill="#e8b49a" font-weight="700">On screen</text>
        <text x="16" y="401" fill="#d9d4e0">ffmpeg -i demo.mp4 -i pop.wav</text>
        <text x="16" y="428" fill="#e8875b">&gt;</text>
        <rect x="30" y="418" width="8" height="13" fill="#f3eff7"/>
      </g>
    </g>
  </g>

  <text class="sans" x="640" y="606" fill="#6f6879" font-size="13" text-anchor="middle">Reel Inbox · iPhone Shortcut + macOS worker + MCP server for Claude Code</text>
</svg>
